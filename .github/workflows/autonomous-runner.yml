name: Zero-Touch Autonomous Worker

on:
  push:
    paths:
      - 'TASK.md'
      - 'sprint_state.json'
    branches:
      - main

jobs:
  execute-task:
    # 봇의 재귀적 자동 커밋 루프 방지 (chore(git-ops): completed 커밋은 스킵)
    if: "!contains(github.event.head_commit.message, 'chore(git-ops): completed')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.10 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 의존 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 사전 학습 가중치 다운로드 (RealESRGAN_x4plus)
        run: |
          mkdir -p weights
          if [ ! -f "weights/RealESRGAN_x4plus.pth" ]; then
            curl -L -o weights/RealESRGAN_x4plus.pth \
              https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          fi

      - name: 단위 테스트(pytest) 자율 검증
        run: |
          pytest tests/ --tb=short

      - name: 데모 파이프라인 실행 및 산출물(comparison.png) 생성
        run: |
          python scripts/demo.py

      - name: 상태 머신 COMPLETED 갱신 및 깃 푸시
        run: |
          git config --global user.name "Jarvis-Autopilot"
          git config --global user.email "jarvis-autopilot@users.noreply.github.com"
          
          # sprint_state.json 상태 COMPLETED로 변경
          python -c "
          import json, datetime
          try:
              with open('sprint_state.json', 'r') as f:
                  data = json.load(f)
              data['status'] = 'COMPLETED'
              data['completed_at'] = datetime.datetime.utcnow().isoformat() + 'Z'
              with open('sprint_state.json', 'w') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
          except Exception as e:
              print(f'Error updating state: {e}')
          "
          
          git add sprint_state.json outputs/comparison.png 2>/dev/null || git add sprint_state.json
          git commit -m "chore(git-ops): completed - task execution succeeded [skip ci]" || echo "No changes to commit"
          git push origin main
