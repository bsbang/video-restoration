[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-restoration"
version = "0.1.0"
description = "OpenCV and NumPy based vintage camcorder video restoration pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
    "scikit-image>=0.18.0",
]

[project.scripts]
video-restore = "cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_restoration*"]
